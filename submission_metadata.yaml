ai_usage_summary: |
  Used Claude for architectural discussion, code review, and debugging.
  All scoring logic, weights, and ranking decisions were designed and
  validated by the participant. No candidate data was fed to any LLM
  during the ranking step. The ranking runs entirely offline on CPU.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Rule-based multi-signal ranker with five scoring components combined
  with weighted aggregation. Components: (1) Skills match — required JD
  skills like embeddings, vector DBs, retrieval, Python weighted by
  proficiency and duration, with honeypot detection for expert skills
  with zero duration/endorsements; (2) Career quality — reads actual
  job description text for evidence of shipping ranking/retrieval
  systems at product companies, penalizes pure consulting backgrounds
  and non-technical titles; (3) Behavioral signals — weights recency
  of activity, open-to-work flag, recruiter response rate, notice
  period, and GitHub activity score; (4) Location fit — Pune/Noida/
  Delhi NCR/Hyderabad preferred, with relocation bonus; (5) Education
  tier. Final score = 0.30 x skills + 0.30 x career + 0.15 x signals
  + 0.15 x location + 0.10 x education. Runtime ~3 minutes for 100K
  candidates on CPU with no network calls.

